<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="theme-color"
    content="#06080d"
  >

  <title>404 — Perfect Client</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;

      margin: 0;

      display: grid;
      place-items: center;

      padding: 24px;

      color: #f7f9fd;

      background:
        radial-gradient(
          circle at 50% 20%,
          rgba(121,105,255,.17),
          transparent 35%
        ),
        #06080d;

      font-family:
        Inter,
        "Segoe UI",
        Arial,
        sans-serif;

      text-align: center;
    }

    main {
      max-width: 560px;
    }

    img {
      width: 76px;
      height: 76px;

      object-fit: contain;

      margin:
        0 auto 25px;
    }

    h1 {
      margin: 0;

      font-size:
        clamp(
          72px,
          18vw,
          150px
        );

      line-height: .9;

      letter-spacing: -7px;
    }

    h2 {
      margin:
        25px 0 10px;

      font-size: 27px;
    }

    p {
      margin:
        0 0 28px;

      color: #a7b0bf;

      line-height: 1.7;
    }

    a {
      min-height: 50px;

      padding:
        0 20px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      border-radius: 13px;

      color: white;

      background:
        linear-gradient(
          120deg,
          #52d7ff,
          #7969ff
        );

      text-decoration: none;

      font-size: 13px;
      font-weight: 800;
    }
  </style>
</head>

<body>

  <main>

    <img
      src="./logo.png"
      alt="Perfect Client"
    >

    <h1>
      404
    </h1>

    <h2>
      This chunk isn't loaded.
    </h2>

    <p>
      The page you're looking for doesn't exist.
      Head back to Perfect Client.
    </p>

    <a href="/">
      Back home
    </a>

  </main>

</body>
</html>
